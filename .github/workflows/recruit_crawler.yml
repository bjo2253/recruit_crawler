name: Recruit Crawler

on:
  schedule:
    - cron: "0 0 * * *" # 매일 0시(UTC) 실행 → 한국 시간은 오전 9시
  workflow_dispatch: # 필요 시 수동 실행 버튼도 활성화

permissions:
  contents: write # 결과 CSV를 저장소에 커밋하기 위해 필요

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Run crawler
        env:
          # 이메일은 선택사항: Secrets가 없으면 전송을 건너뛰고 CSV만 저장합니다.
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python saramin_crawler.py

      - name: Commit results CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "새 결과 없음"
          else
            git commit -m "크롤링 결과 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
